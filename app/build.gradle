apply plugin: 'com.android.application'

android {
    namespace 'io.kuenzler.whatsappwebtogo'
    compileSdk 34

    defaultConfig {
        applicationId "io.kuenzler.whatsappwebtogo"
        minSdk 26
        targetSdk 34
        versionCode 39
        versionName "1.7.7"
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Tenganisha APK kwa aina za CPU ili faili liwe dogo (~65MB badala ya 250MB)
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // Injini rasmi ya Mozilla GeckoView (Toleo thabiti linalopatikana kirahisi kwenye Maven)
    implementation "org.mozilla.geckoview:geckoview:121.0.20231211182132"
}
